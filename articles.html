<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статьи — исследования и практика байкфита</title>
<link rel="stylesheet" href="site.css">
<style>

/* ---- список статей ---- */
.wrap{max-width:900px}
.post{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--bd);
      border-radius:10px;padding:16px 18px;margin-bottom:12px}
.post:hover{border-color:#c9c9c8;background:#fdfdfd}
.pmeta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:11.5px;color:#9a9a9a;margin-bottom:5px}
.pmeta time{font-variant-numeric:tabular-nums}
.ptitle{font-size:16px;font-weight:650;line-height:1.35;margin:0 0 6px}
.plead{font-size:13px;color:#4a4a4a;line-height:1.6;margin:0}
.pmore{font-size:12.5px;color:var(--acc);font-weight:600;margin-top:9px}
.empty{font-size:13px;color:var(--mut);line-height:1.6}

/* Отличия этой страницы от общей основы (site.css). */
.sub{max-width:820px;line-height:1.55}
.card{padding:16px 18px}
</style>
</head>
<body>

<script src="nav.js"></script>

<div class="wrap">
<h1>Статьи</h1>
<div class="sub">Исследования, разборы и практические руководства по байкфиту. То, что не помещается в подсказку у поля ввода: откуда берутся правила, где они расходятся между собой и что с этим делать.</div>

<div id="list"></div>
</div>

<script>
/* Список статей. Чтобы добавить новую: положить рядом файл article-<слаг>.html
   и дописать сюда одну запись сверху. Порядок в массиве и есть порядок на странице —
   сортировки по дате нет намеренно, чтобы можно было закрепить что-то важное. */
const POSTS = [
  {
    href:  'article-bikefit-approaches.html',
    date:  '2026-08-12',
    tags:  ['исследование'],
    title: 'Как выбирают размер и геометрию MTB: обзор профессиональных и любительских подходов',
    lead:  'Почему reach и stack вытеснили «размер рамы», что такое RAD и откуда взялся множитель 4.47, чем MTB-байкфит отличается от шоссейного, и где эксперты друг с другом не согласны. Со списком источников и честным разделом про ограничения.',
    read:  '25 минут'
  }
];

document.getElementById('list').innerHTML = POSTS.length
  ? POSTS.map(p => `<a class="post" href="${p.href}">
      <div class="pmeta">
        <time datetime="${p.date}">${new Date(p.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</time>
        ${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
        ${p.read?`<span>${p.read} чтения</span>`:''}
      </div>
      <div class="ptitle">${p.title}</div>
      <p class="plead">${p.lead}</p>
      <div class="pmore">Читать →</div>
    </a>`).join('')
  : '<div class="card empty">Пока пусто.</div>';
</script>

<script>
/* Отключить аналитику для себя: открыть любую страницу с #toggle-goatcounter. */
(function(){
  if (location.hash !== '#toggle-goatcounter') return;
  var off;
  try{
    off = localStorage.getItem('skipgc') !== 't';
    if (off) localStorage.setItem('skipgc','t'); else localStorage.removeItem('skipgc');
  }catch(e){ return; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; }
  alert('Аналитика в этом браузере ' + (off ? 'ВЫКЛЮЧЕНА' : 'ВКЛЮЧЕНА') + '.');
})();
</script>

<script data-goatcounter="https://evo-expirience.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
