   <760      всё в одну колонку

<script>
/* Отключить аналитику для себя: открыть любую страницу с #toggle-goatcounter.
   Обрабатываем здесь, а не в count.js: наши страницы переписывают хеш своим
   состоянием раньше, чем успевает догрузиться асинхронный count.js, и его
   собственная проверка переключателя до хеша уже не доживает. */
(function(){
  if (location.hash !== '#toggle-goatcounter') return;
  var off;
  try{
    off = localStorage.getItem('skipgc') !== 't';
    if (off) localStorage.setItem('skipgc','t'); else localStorage.removeItem('skipgc');
  }catch(e){ return; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; }
  alert('Аналитика в этом браузере ' + (off ? 'ВЫКЛЮЧЕНА' : 'ВКЛЮЧЕНА') + '.');
})();

/* Путь для статистики — только имя файла, без папки, в которой лежит сайт.
   Иначе одна и та же страница считается дважды: сервер отдаёт её и по
   /bike-geometry-lab/, и по /bike-geometry-lab/index.html, а для GoatCounter
   это два разных пути. Заодно цифры перестают зависеть от места публикации:
   в подпапке, в корне домена или на зеркале — статистика одна и та же.
   Ставится ДО загрузки count.js, он делает window.goatcounter||{} и наше
   значение сохраняет. */
window.goatcounter = window.goatcounter || {};
window.goatcounter.path = function(){
  return '/' + (location.pathname.split('/').pop() || 'index.html');
};

<script>
/* Событие в GoatCounter. Скрипт грузится async и может не загрузиться вовсе
   (блокировщик), поэтому вызов всегда защищён и молча ничего не делает.
   no_session — чтобы считался каждый клик, а не первый за сессию. */
function track(name){
  try{
    if(window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({path:name, event:true, no_session:true});
  }catch(e){}
}

/* ================= модель ================= */
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;

const PRESETS = {
  B1:{name:"Outleap Warhog L 2025", reach:465, stack:629, hta:65.8, sta:75.5, ht:115, st:460, cs:435, bbDrop:50,  wb:1213, offset:null, travelRef:130, travel:130, sag:25, forkA2C:null, forkA2Cnew:null, forkOffsetNew:null},
  B2:{name:"Hagen 4 XL 2025",       reach:440, stack:645.5, hta:68.5, sta:74.3, ht:110, st:508, cs:440, bbDrop:63.5, wb:1159, offset:null, travelRef:120, travel:120, sag:25, forkA2C:null, forkA2Cnew:null, forkOffsetNew:null}
};

const state = {
  bikes:[ {...PRESETS.B1}, {...PRESETS.B2} ],
  wheelR: 368,          // радиус колеса 29" x 2.4
};

/*
  solve(b): строит раму по паспортным числам, затем пересчитывает под текущий ход вилки.
  Логика:
   1. Паспортная рама в системе каретки (BB = 0,0), передняя ось на высоте bbDrop.
   2. Из паспортных точек выводим фактическую вилку: составляющую вдоль оси рулевой (d)
      и офсет (o). Так мы не зависим от того, какую вилку ставил производитель.
   3. Изменение хода на Δ удлиняет вилку ВДОЛЬ оси рулевой: d' = d + Δ. Офсет не меняется.
   4. Поворачиваем всю раму вокруг задней оси так, чтобы передняя ось снова оказалась
      на той же высоте — то есть оба колеса стоят на земле.
   5. Из повёрнутых точек читаем фактические reach/stack/углы/drop.
*/
function solve(b){
  /* Тонкая обёртка над общей моделью из model.js. Специфичное для этой страницы:
     виртуальная верхняя труба, ETT, front center и высота каретки от земли. */
  const r = BikeModel.solveFrame(b, state.wheelR);
  const P = r.P;
  const virt = [P.BB[0] - r.stack/Math.tan(rad(r.sta)), P.BB[1] + r.stack];
  return {b, P, virt, theta:r.theta,
    hta:r.hta, sta:r.sta, reach:r.reach, stack:r.stack, bbDrop:r.bbDrop, wb:r.wb,
    bbH: state.wheelR - r.bbDrop, trail:r.trail,
    ett: P.htTop[0]-virt[0],
    fc: Math.hypot(P.front[0]-P.BB[0], P.front[1]-P.BB[1]),
    cs: Math.hypot(P.rear[0]-P.BB[0], P.rear[1]-P.BB[1]),
    a2cRef:r.a2cRef, a2cNew:r.a2cNew,
    offset:r.oNew, offsetRef:r.oRef, forkAxRef:r.dRef, dA2C:r.dA2C, sagMM:r.sagMM,
    ground: P.rear[1] - state.wheelR
  };
}

/* ================= отрисовка ================= */
function L(a,b,c,w,d){return `<line x1="${a[0].toFixed(1)}" y1="${(-a[1]).toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${(-b[1]).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`}
function C(p,r,c,w,d){return `<circle cx="${p[0].toFixed(1)}" cy="${(-p[1]).toFixed(1)}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}"${d?` stroke-dasharray="${d}"`:''}/>`}
function Dt(p,c,r){return `<circle cx="${p[0].toFixed(1)}" cy="${(-p[1]).toFixed(1)}" r="${r}" fill="${c}"/>`}
function Tx(p,s,c,sz,an,extra){return `<text x="${p[0].toFixed(1)}" y="${(-p[1]).toFixed(1)}" fill="${c}" font-size="${sz}" text-anchor="${an||'middle'}" font-family="system-ui"${extra||''}>${s}</text>`}

function drawFrame(S, color, thin){
  const P = S.P, R = state.wheelR, W = thin?9:12;
  let s = '';
  s += C(P.rear, R, color, 4, "16 13");
  s += C(P.front, R, color, 4, "16 13");
  s += L(P.BB, P.rear, color, W);
  s += L(P.stTop, P.rear, color, W);
  s += L(P.BB, P.stTop, color, W);
  s += L(P.stTop, S.virt, color, 3.5, "12 10");
  s += L(P.stTop, P.htTop, color, W);
  s += L(S.virt, P.htTop, color, 3, "8 10");
  s += L(P.BB, P.htBot, color, W);
  s += L(P.htBot, P.htTop, color, W+5);
  s += L(P.htBot, P.front, color, W-3);
  s += Dt(P.BB, color, 13);
  return s;
}

function render(){
  markFrontAxle();
  const S = state.bikes.map(b => BikeModel.hasFrontAxle(b) ? solve(b) : null);
  const colors = ["var(--c1)","var(--c2)"];
  const hex = ["#e8543f","#2b6cb0"];

  // приводим к общей системе: земля = 0, ЗАДНЯЯ ОСЬ на x = 0
  // ci — слот рамы: по нему цвет, даже если соседняя рама не считается
  const shifted = S.map((s,ci)=>{
    if(!s) return null;
    const dx = -s.P.rear[0], dy = -s.ground;
    const mv = q => [q[0]+dx, q[1]+dy];
    return {...s, ci, P:Object.fromEntries(Object.entries(s.P).map(([k,v])=>[k,mv(v)])), virt:mv(s.virt)};
  }).filter(Boolean);
  if(!shifted.length){
    document.getElementById('chart').innerHTML = `<div class="needmsg">${BikeFrame.HINTS.needFrontAxle}</div>`;
    buildTable(S); buildProfile(); syncHash();
    return;
  }

  // границы
  let minX=1e9,maxX=-1e9,maxY=-1e9;
  shifted.forEach(s=>{
    minX=Math.min(minX,s.P.rear[0]-state.wheelR);
    maxX=Math.max(maxX,s.P.front[0]+state.wheelR);
    maxY=Math.max(maxY,s.P.htTop[1]+120, s.virt[1]+120);
  });
  const padL=300, padR=100, padT=170, padB=300;
  const vbX=minX-padL, vbW=(maxX-minX)+padL+padR;
  const vbY=-(maxY+padT), vbH=(maxY)+padT+padB;
  const R = state.wheelR;

  let g = '';
  // земля
  g += `<line x1="${vbX}" y1="0" x2="${vbX+vbW}" y2="0" stroke="#333" stroke-width="5"/>`;
  g += `<text x="${vbX+14}" y="46" font-size="30" font-family="system-ui" fill="#888">земля</text>`;
  // вертикаль через совмещённую заднюю ось
  g += `<line x1="0" y1="70" x2="0" y2="${vbY+padT-40}" stroke="#9b9b9b" stroke-width="3.5" stroke-dasharray="16 13"/>`;

  shifted.forEach(s=> g += drawFrame(s, hex[s.ci], s.ci>0));

  // вертикали кареток + подписи смещения каретки от задней оси
  shifted.forEach((s,i)=>{
    const bx = s.P.BB[0];
    g += `<line x1="${bx.toFixed(1)}" y1="20" x2="${bx.toFixed(1)}" y2="${-(s.P.BB[1]+70)}" stroke="${hex[s.ci]}" stroke-width="2.5" stroke-dasharray="9 9" opacity=".75"/>`;
  });

  // выноски высоты каретки (слева от заднего колеса)
  let xo = -R-90;
  shifted.forEach((s,i)=>{
    g += `<line x1="${xo}" y1="0" x2="${xo}" y2="${-s.bbH}" stroke="${hex[s.ci]}" stroke-width="4"/>`;
    g += `<line x1="${xo}" y1="${-s.bbH}" x2="${(s.P.BB[0]).toFixed(1)}" y2="${-s.bbH}" stroke="${hex[s.ci]}" stroke-width="2.5" stroke-dasharray="11 9" opacity=".8"/>`;
    g += Tx([xo-16, s.bbH+14], `BB ${s.bbH.toFixed(1)}`, hex[s.ci], 30, "end");
    xo -= 110;
  });

  /* ---- габаритные линейки под землёй ---- */
  function ruler(y, x1, x2, color, label){
    const t = 16;
    return `<line x1="${x1.toFixed(1)}" y1="${-y}" x2="${x2.toFixed(1)}" y2="${-y}" stroke="${color}" stroke-width="4"/>`
         + `<line x1="${x1.toFixed(1)}" y1="${-y+t}" x2="${x1.toFixed(1)}" y2="${-y-t}" stroke="${color}" stroke-width="4"/>`
         + `<line x1="${x2.toFixed(1)}" y1="${-y+t}" x2="${x2.toFixed(1)}" y2="${-y-t}" stroke="${color}" stroke-width="4"/>`
         + Tx([(x1+x2)/2, y+22], label, color, 30);
  }
  shifted.forEach((s,i)=>{
    const y = -(90 + i*95);          // ниже линии земли
    const x1 = s.P.rear[0]-R, x2 = s.P.front[0]+R;
    g += ruler(y, x1, x2, hex[s.ci], `габарит ${(x2-x1).toFixed(0)} мм`);
    // точка контакта переднего колеса
    g += `<line x1="${s.P.front[0].toFixed(1)}" y1="14" x2="${s.P.front[0].toFixed(1)}" y2="${-y-40}" stroke="${hex[s.ci]}" stroke-width="2.5" stroke-dasharray="9 9" opacity=".7"/>`;
  });
  // разница пятен контакта переднего колеса
  if(shifted.length===2){
    const dxf = shifted[1].P.front[0]-shifted[0].P.front[0];
    if(Math.abs(dxf)>0.5){
      const y = -(90+2*95);
      const a = Math.min(shifted[0].P.front[0], shifted[1].P.front[0]);
      const b = Math.max(shifted[0].P.front[0], shifted[1].P.front[0]);
      g += ruler(y, a, b, "#555", `перед. пятно контакта: разница ${Math.abs(dxf).toFixed(0)} мм`);
    }
    // разница положения кареток — над землёй, подпись справа от правой вертикали
    const dxb = shifted[1].P.BB[0]-shifted[0].P.BB[0];
    if(Math.abs(dxb)>0.5){
      const a = Math.min(shifted[0].P.BB[0], shifted[1].P.BB[0]);
      const b = Math.max(shifted[0].P.BB[0], shifted[1].P.BB[0]);
      const y = 78, t = 13;
      g += `<line x1="${a.toFixed(1)}" y1="${-y}" x2="${b.toFixed(1)}" y2="${-y}" stroke="#666" stroke-width="3.5"/>`;
      g += `<line x1="${a.toFixed(1)}" y1="${-y+t}" x2="${a.toFixed(1)}" y2="${-y-t}" stroke="#666" stroke-width="3.5"/>`;
      g += `<line x1="${b.toFixed(1)}" y1="${-y+t}" x2="${b.toFixed(1)}" y2="${-y-t}" stroke="#666" stroke-width="3.5"/>`;
      g += Tx([b+26, y-11], `каретка: ${Math.abs(dxb).toFixed(0)} мм`, "#666", 30, "start");
    }
  }

  // заголовки
  let head = '';
  shifted.forEach((s,i)=>{
    const b = s.b;
    head += `<text x="${vbX+20}" y="${vbY+56+i*52}" font-size="38" font-family="system-ui" fill="${hex[s.ci]}">`
          + `${esc(b.name)} — ход ${b.travel} мм, sag ${b.sag ?? 0}% · reach ${s.reach.toFixed(0)} · stack ${s.stack.toFixed(0)} · HTA ${s.hta.toFixed(1)}° · WB ${s.wb.toFixed(0)}</text>`;
  });
  // рама, которая не считается, остаётся в заголовке — иначе её исчезновение со схемы выглядело бы багом
  S.forEach((s,ci)=>{
    if(s) return;
    head += `<text x="${vbX+20}" y="${vbY+56+shifted.length*52}" font-size="38" font-family="system-ui" fill="${hex[ci]}">`
          + `${esc(state.bikes[ci].name)} — не считается: нет ни колёсной базы, ни офсета вилки</text>`;
  });

  // ограничиваем высоту схемы, чтобы при раскладке «ввод слева, схема справа»
  // она целиком помещалась в экран рядом с полями
  const ratio = (vbW/vbH).toFixed(3);
  document.getElementById('chart').innerHTML =
    `<svg viewBox="${vbX.toFixed(0)} ${vbY.toFixed(0)} ${vbW.toFixed(0)} ${vbH.toFixed(0)}" xmlns="http://www.w3.org/2000/svg"`
    + ` style="width:100%;height:auto;max-width:calc(80vh * ${ratio})">${head}${g}</svg>`;

  buildTable(S);
  buildProfile();
  syncHash();
}

/* ================= таблица ================= */
const ROWS = [
  ["__g","Посадка"],
  ["Reach",        s=>s.reach,  s=>s.b.reach, 0],
  ["Stack",        s=>s.stack,  s=>s.b.stack, 0],
  ["Stack / Reach",s=>s.stack/s.reach, null, 2],
  ["Эфф. верхняя труба", s=>s.ett, null, 0],
  ["Подседельная труба", s=>s.b.st, null, 0],
  ["__g","Углы"],
  ["Угол рулевой, °",     s=>s.hta, s=>s.b.hta, 1],
  ["Угол подседельной, °",s=>s.sta, s=>s.b.sta, 1],
  ["__g","Шасси"],
  ["Колёсная база",  s=>s.wb, null, 0],
  ["Перья (CS)",     s=>s.cs, null, 0],
  ["Каретка перед задней осью, гориз.", s=>s.P.BB[0]-s.P.rear[0], null, 0],
  ["Front center",   s=>s.fc, null, 0],
  ["Вес на переднем, %", s=>100*(1-s.cs/s.wb), null, 1],
  ["BB drop",        s=>s.bbDrop, s=>s.b.bbDrop, 1],
  ["Высота каретки", s=>s.bbH, null, 1],
  ["Механический трейл", s=>s.trail, null, 0],
  ["__g","Габариты (для транспорта)"],
  ["Длина по колёсам (край→край)", s=>s.wb + 2*state.wheelR, null, 0],
  ["Длина в метрах", s=>(s.wb + 2*state.wheelR)/1000, null, 3],
  ["Высота руля от земли", s=>s.stack + s.bbH, null, 0],
  ["__g","Вилка"],
  ["Ход, мм",      s=>s.b.travel, s=>s.b.travelRef, 0],
  ["SAG, %",       s=>s.b.sag ?? 0, null, 0],
  ["Просадка, мм", s=>s.sagMM, null, 0],
  ["A2C, мм",      s=>s.a2cNew, s=>s.a2cRef, 0],
  ["Офсет, мм",    s=>s.offset, s=>s.offsetRef, 0],
  ["Наклон рамы, °", s=>s.theta, null, 2],
];

function buildTable(S){
  // S[i] === null — рама не считается; её колонка и разница остаются пустыми
  const names = S.map((s,i)=>esc((s ? s.b : state.bikes[i]).name));
  let t = `<table><thead><tr><th>Параметр</th>
      <th style="color:#e8543f">${names[0]}</th>
      <th style="color:#2b6cb0">${names[1]}</th>
      <th>Δ (2−1)</th></tr></thead><tbody>`;
  for(const row of ROWS){
    if(row[0]==="__g"){ t += `<tr class="grp"><td colspan="4">${row[1]}</td></tr>`; continue; }
    const [n, f, fSpec, dec] = row;
    const v = S.map(s => s ? f(s) : null);
    const cells = S.map((s,i)=>{
      if(!s) return '<td>—</td>';
      const spec = fSpec ? fSpec(s) : null;
      const changed = spec!=null && Math.abs(spec - v[i]) > 0.05;
      return `<td>${v[i].toFixed(dec)}${changed?`<div class="spec">паспорт ${(+spec).toFixed(dec)}</div>`:''}</td>`;
    }).join('');
    if(v[0]==null || v[1]==null){ t += `<tr><td>${n}</td>${cells}<td class="dcol">—</td></tr>`; continue; }
    const d = v[1]-v[0];
    const cls = Math.abs(d)<0.05 ? '' : (d>0?'pos':'neg');
    t += `<tr><td>${n}</td>${cells}<td class="dcol ${cls}">${d>0?'+':''}${d.toFixed(dec)}</td></tr>`;
  }
  t += '</tbody></table>';
  document.getElementById('table').innerHTML = t;

  // предупреждение о сильном отходе от паспорта
  const w = document.getElementById('warn');
  const msgs = S.filter(s=>s && Math.abs(s.b.travel-s.b.travelRef)>30)
                .map(s=>`«${esc(s.b.name)}»: ход отличается от паспортного на ${(s.b.travel-s.b.travelRef>0?'+':'')}${(s.b.travel-s.b.travelRef).toFixed(0)} мм`);
  if(msgs.length){ w.style.display='block'; w.innerHTML = msgs.join('<br>') + '<br>Геометрия пересчитана корректно, но такая вилка может не влезть в раму и аннулировать гарантию.'; }
  else w.style.display='none';

  document.getElementById('note').innerHTML =
   `Радиус колеса ${state.wheelR} мм — задаётся в меню «Колесо» над страницей, 26 / 27.5 / 29 считаются одинаково корректно. Вилка выводится из введённой геометрии: её длина вдоль оси рулевой и офсет считаются из паспортных reach / stack / HTA / BB drop / базы,
    поэтому при базовом ходе цифры точно совпадают с паспортом. Изменение хода удлиняет вилку вдоль оси рулевой, рама поворачивается вокруг задней оси до касания земли передним колесом.
    <b>SAG</b> — просадка вилки под весом райдера в % от хода. Паспортная геометрия измерена с разжатой вилкой, поэтому при 0% таблица совпадает с паспортом,
    а при 25% ты видишь рабочую геометрию хардтейла под райдером: сзади жёстко, спереди вилка села, рама доворачивается носом вниз вокруг задней оси.
    Для хардтейла это полная модель — других степеней свободы нет. Эффективная верхняя труба — горизонталь на высоте стека до линии подседельной трубы (производители меряют её по-разному).
    Длина по колёсам = колёсная база + два радиуса колеса; при покрышке шире/уже поменяй радиус в меню «Колесо». Реальная погрузочная длина будет на 20–40 мм больше за счёт покрышки и грязевика.
    <br><b>Важно про радиус:</b> он один на обе рамы и на оба колеса. Сравнивать 29 с 27.5 можно — reach, stack, углы и база верны для обеих, — но высота каретки, трейл и габарит будут посчитаны по одному радиусу. Маллет (разные колёса спереди и сзади) модель не выражает вовсе: обе оси принудительно стоят на высоте BB drop. Подробности — <a href="help.html#limits" style="color:inherit">в разделе об ограничениях</a>.`;
}

/* ================= что это за рамы ================= */
/* Слова и пороги — в profile.js, общие и прогоняемые регрессом (блок prof|);
   здесь только вёрстка. Профиль описывает паспорт с текущей вилкой без sag:
   каталожные диапазоны сняты так же, а слайдер sag двигает только схему и
   таблицу. Перебор каталога кокпита для «подходит от» — полторы тысячи
   вызовов солвера, поэтому ответ запоминается, пока рама и колесо те же:
   render() зовётся на каждое нажатие клавиши в любом поле. */
const PROF_MEMO = [{key:null,val:null},{key:null,val:null}];
function profileOf(i){
  const {sag, name, ...geo} = state.bikes[i];   // ни sag, ни название на профиль не влияют
  const key = JSON.stringify([geo, state.wheelR]), m = PROF_MEMO[i];
  if(m.key !== key){ m.key = key; m.val = BikeProfile.describe(geo, state.wheelR); }
  return m.val;
}

/* Строки одной рамы: подпись, число, слово, пояснение. key связывает строки
   двух рам: одинаковое пояснение показывается один раз, в блоке «У обеих». */
function profRows(d){
  const r = Math.round, rows = [], x = d.num, S = BikeProfile.STYLES;
  if(d.size){
    /* Рост по reach показывается как есть; что типичный для стиля дроппер
       поднимает его нижнюю границу — в подписи. Сама граница и три штыря —
       строкой «Подседельная». */
    const z = d.size, seat = d.seat, T = seat && seat.drops[0];
    const lift = !seat || !seat.raises ? ''
               : `типичный для стиля дроппер поднимает нижнюю границу до ${r(T.min)} см`
                 + (seat.raises===2 ? ' — выше всего диапазона по reach: рама коротка по длине и высока по подседельной' : '');
    rows.push({key:'size', label:'Размер по reach', val:z.name, word:`рост ~${r(z.lo)}–${r(z.hi)} см`,
      text:[z.scale==='fs' ? 'по шкале двухподвесов' : '', lift].filter(Boolean).join('; ')});
    if(seat) rows.push({key:'seat', label:'Подседельная', val:`${r(seat.st)} мм`,
      word:`с жёстким штырём подходит от ${r(seat.rigid.min)} см, inseam от ${r(seat.rigid.inseam)} см`,
      text:seat.drops.map(x=>`с дроппером ${x.drop} мм — от ${r(x.min)} см, inseam от ${r(x.inseam)} см`).join('<br>')});
    for(const [s,k] of [['m','муж'],['f','жен']]){
      const R = d.rad[s];
      rows.push({key:'rad'+s, label:`По RAD, ${k} ${BikeProfile.RADMULT[s].toFixed(2)}`,
        val:`~${r(R.lo)}–${r(R.hi)} см`, word:`подходит от ${r(R.min)} см`, text:''});
    }
  } else rows.push({key:'size', label:'Размер', val:'по таблице производителя', word:'',
    text:'reach у таких рам мал, длину добирают выносом — рост по reach не читается'});
  rows.push({key:'travel', label:'Ход вилки', val:`${x.travel} мм`,
    word: d.travel ? S[d.travel.style].name : 'не учитывается',
    text: d.travel ? d.travel.text : 'у гравийных и городских рам вилка обычно жёсткая'});
  rows.push({key:'hta', label:'Угол рулевой', val:`${x.hta.toFixed(1)}°`, word:S[d.hta.style].name, text:d.hta.text});
  rows.push({key:'posture', label:'Посадка', val:`stack/reach ${x.srN.toFixed(2)}`, word:d.posture.word, text:d.posture.text});
  rows.push({key:'cs', label:'Перья', val:`${x.cs.toFixed(0)} мм`, word:d.cs.word, text:d.cs.text});
  rows.push({key:'wb', label:'База', val:`${x.wb.toFixed(0)} мм`, word:d.wb.word,
    text: d.wb.text + (d.wb.vsTyp<0 ? '; живее типичной для этого стиля' : d.wb.vsTyp>0 ? '; устойчивее типичной для этого стиля' : '')});
  return rows;
}

function buildProfile(){
  const host = document.getElementById('profile');
  if(!host) return;
  const D = state.bikes.map((b,i)=>BikeModel.hasFrontAxle(b) ? profileOf(i) : null);
  const R = D.map(d=>d ? profRows(d) : null);
  // пояснение, одинаковое у обеих рам, уходит вниз одной строкой
  const shared = new Set(), both = [];
  if(R[0] && R[1]) for(const a of R[0]){
    const b = R[1].find(x=>x.key===a.key);
    if(b && a.text && a.text===b.text && a.word===b.word){ shared.add(a.key); both.push(`<b>${a.label}</b> — ${a.word ? a.word+': ' : ''}${a.text}`); }
  }
  const sharedNotes = D[0] && D[1] ? D[0].notes.filter(n=>D[1].notes.some(m=>m.key===n.key)).map(n=>n.key) : [];
  sharedNotes.forEach(k=>both.push(D[0].notes.find(n=>n.key===k).text));

  const col = (d,i)=>{
    const b = state.bikes[i], color = i ? 'var(--c2)' : 'var(--c1)';
    const head = `<div class="pttl" style="color:${color}">Рама ${i+1}${(b.name||'').trim() ? ': '+esc(b.name.trim()) : ''}</div>`;
    if(!d) return `<div class="pcol">${head}<div class="ppur" style="margin-top:6px">—<br><span class="px">${BikeFrame.HINTS.needFrontAxle}</span></div></div>`;
    const st = d.style;
    const edge = st.edgeName ? `<span class="pedge">на границе с «${st.edgeName}»</span>` : '';
    const rows = R[i].map(x=>`<dl class="prow"><dt>${x.label}</dt><dd><span>${x.val}</span>${x.word ? ` · <span class="pw">${x.word}</span>` : ''}`
      + (x.text && !shared.has(x.key) ? `<div class="px">${x.text}</div>` : '') + '</dd></dl>').join('');
    const notes = d.notes.filter(n=>!sharedNotes.includes(n.key)).map(n=>`<div class="pnote">${n.text}</div>`).join('');
    return `<div class="pcol">${head}
      <div class="pstyle${st.kind==='dispute' ? ' pdisp' : ''}">${st.name}${edge}</div>
      <div class="ppur">${st.purpose}</div>
      <div class="pbase">паспорт${d.travel ? ` с вилкой ${d.num.travel} мм` : ''}, без sag</div>
      ${rows}${notes}</div>`;
  };
  host.innerHTML = `<div class="prof">${D.map(col).join('')}</div>`
    + (both.length ? `<div class="pboth"><div style="color:var(--mut)">У обеих рам</div>${both.map(t=>`<div>${t}</div>`).join('')}</div>` : '')
    + `<div class="pfoot">Рост — три ориентира. Размер по reach — по таблицам производителей 2025–2026, у хардтейлов и двухподвесов шкалы разные.
       Подседельная — с какого роста седло опускается так, что колено внизу хода педали не разогнуто сверх здорового (152°, как в Fit Lab): с жёстким штырём, с дроппером типичного для стиля хода и на 25 мм короче.
       RAD — альтернативная усреднённая методика Маккормака: RAD = рост × множитель; диапазон — с типичным для стиля кокпитом,
       «подходит от» — с самым низким и близким кокпитом из каталога Fit Lab, ниже этого роста рама велика при любом кокпите.
       Посадка здесь — рамы, без кокпита: вынос, руль и проставки двигают руль сильнее, чем различаются большинство рам.
       Точный ответ по твоим меркам — в Fit Lab, кнопка «Открыть в Fit Lab» в карточке рамы.
       Откуда диапазоны и чего описание не знает — <a href="help.html#profile" style="color:inherit">в справке</a>.</div>`;
}

/* ================= интерфейс ================= */
/* Поля, подписи, шаги, подсказки и раскладка основной сетки рамы — в frame.js,
   общие с Fit Lab. Карточка рамы здесь стоит так же, как там: сетка паспорта,
   слайдеры, «Проверка вилки», «Замена вилки». Своё у этой страницы — цвет рамы,
   два слота и кнопка переноса в Fit Lab. Радиус колеса один на обе рамы и живёт
   в меню «Колесо» тулбара, а не в карточке. */
// поле ввода рамы: четвёртый элемент кортежа — подсказка в пустом поле
const numInput = (i,b,[k,l,st,ph],def) =>
  `<label>${l}</label><input type="number" step="${st}" data-i="${i}" data-k="${k}" value="${b[k]??''}" placeholder="${ph||def}">`;
const slider = (i,b,k,id) => { const d=BikeFrame.SLIDERS[k];
  return `<div class="row">
         <span style="color:#191919;min-width:82px">${d.label}</span>
         <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" data-i="${i}" data-k="${k}" value="${b[k]}">
         <span class="tval" id="${id}${i}">${b[k]}${d.unit}</span>
       </div>`; };

function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

/* Свёрнута ли карточка рамы — помнится между заходами. Ключ свой, а не общий
   с Fit Lab (bikelab.cards.v1): у того своя история форм с переносом старых,
   и чужие id в нём ничего не дали бы, кроме связности двух страниц. Нет
   хранилища — карточки просто раскрыты при каждом заходе. */
const BIKEOPEN_KEY='bikelab.geo.open.v1';
const bikeOpen=(()=>{
  try{ const o=JSON.parse(localStorage.getItem(BIKEOPEN_KEY));
       if(Array.isArray(o)) return [o[0]!==false, o[1]!==false]; }catch(e){}
  return [true,true];
})();
function bikeOpenSave(){ try{ localStorage.setItem(BIKEOPEN_KEY, JSON.stringify(bikeOpen)); }catch(e){} }
// хвост заголовка свёрнутой карточки: «Рама 1: Outleap Warhog L 2025»
const bikeSum = b => (b.name||'').trim() ? ': '+esc(b.name.trim()) : '';

function buildInputs(){

  host.innerHTML = state.bikes.map((b,i)=>`
   <div class="card bikecard${bikeOpen[i]?'':' closed'}" style="color:${i?'var(--c2)':'var(--c1)'}">

     </h3>
     <div class="cardbody">
     <label class="namefield">Название
       <input data-i="${i}" data-k="name" value="${esc(b.name)}" placeholder="например, модель и размер">
     </label>
     ${BikePresets.rowHTML('geo',i,'Сохраняется под названием, вписанным выше. Такое уже есть — запись обновится.')}
     <div class="grid" style="color:#191919">
       ${BikeFrame.GRID.map(f=>numInput(i,b,f,'')).join('')}
     </div>
     <div class="needmsg" data-need="${i}" hidden>${BikeFrame.HINTS.needFrontAxle}</div>
     <div class="travel">
       ${slider(i,b,'travel','tv')}
       ${slider(i,b,'sag','sv')}
       <div class="tdelta" id="td${i}"></div>
     </div>
     <details>
       <summary>Проверка вилки</summary>
       <div class="grid" style="color:#191919">
         ${BikeFrame.FORK_CHECK.map(f=>numInput(i,b,f,'не задан')).join('')}
       </div>
       <div class="srcline" id="fk${i}"></div>
       <div class="hint">${BikeFrame.HINTS.forkCheck}</div>
     </details>
     <details>
       <summary>Замена вилки</summary>
       <div class="grid" style="color:#191919">
         ${BikeFrame.FORK_SWAP.map(f=>numInput(i,b,f,'не задан')).join('')}
       </div>
       <div class="hint">${BikeFrame.HINTS.forkSwap}</div>
     </details>
     <div class="handoff">
       <button class="tofit" onclick="openInFit(${i})">Открыть в Fit Lab ↗</button>
       <span class="hoff">геометрия уедет как есть — вводить заново не надо</span>
     </div>
     </div>
   </div>`).join('');

  host.querySelectorAll('.bikecard > h3').forEach(h=>{
    const toggle=()=>{
      const i=+h.dataset.i, now=!h.parentNode.classList.toggle('closed');
      h.setAttribute('aria-expanded', now);
      bikeOpen[i]=now; bikeOpenSave();
    };
    h.addEventListener('click',toggle);
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });

  host.querySelectorAll('input').forEach(el=>{
    el.addEventListener('input', e=>{
      const i=+el.dataset.i, k=el.dataset.k;
      if(k==='name'){ state.bikes[i].name = el.value; document.getElementById('bs'+i).textContent = bikeSum(state.bikes[i]); }
      else if(el.value==='') state.bikes[i][k] = null;
      else state.bikes[i][k] = parseFloat(el.value);
      if(k==='travel') document.getElementById('tv'+i).textContent = el.value+BikeFrame.SLIDERS.travel.unit;
      if(k==='sag')    document.getElementById('sv'+i).textContent = el.value+BikeFrame.SLIDERS.sag.unit;
      render(); updateTravelNotes(); updateForkChecks();
    });
  });
  updateTravelNotes();
  updateForkChecks();
  BikePresets.refresh();
}

/* Проверка вилки. Считает model.js — обе страницы должны говорить одно и то же,
   поэтому здесь только вёрстка. Пересобирается вместе с числами: карточки
   ввода не перерисовываются на каждый ввод, а этот блок обязан жить. */
function updateForkChecks(){
  state.bikes.forEach((b,i)=>{
    const host=document.getElementById('fk'+i);
    if(!host) return;
    if(!BikeModel.hasFrontAxle(b)){ host.textContent='проверка появится, когда будет задана колёсная база или офсет вилки'; return; }
    try{
      host.innerHTML=BikeModel.forkReportHTML(b, state.wheelR,
        {offset:b.forkOffsetSpec, len:b.forkMeasLen});
    }catch(e){ host.textContent='не удалось посчитать: проверь введённые числа'; }
  });
}

function updateTravelNotes(){
  state.bikes.forEach((b,i)=>{
    const el = document.getElementById('td'+i);
    if(el) el.textContent = BikeFrame.travelNote(b);
  });
}

/* Рамы без базы и без офсета не считаются: у них подсвечиваются оба поля и
   появляется объяснение. Карточки на ввод не пересобираются, поэтому подсветка
   переключается здесь, на каждом пересчёте. */
function markFrontAxle(){
  state.bikes.forEach((b,i)=>{
    const card = document.querySelectorAll('#inputs .card')[i];
    if(!card) return;
    const miss = !BikeModel.hasFrontAxle(b);
    card.querySelectorAll('input[data-k="wb"],input[data-k="offset"]').forEach(el=>el.classList.toggle('need', miss));
    const msg = card.querySelector('.needmsg');
    if(msg) msg.hidden = !miss;
  });
}

/* ==================== пресеты ====================
   Хранилище, импорт, экспорт и строка пресета — общие, в presets.js. Здесь
   только своё: пресет рамы собирается из карточки своего слота и в неё же
   раскладывается, а имя пресета — это название рамы в карточке. */
// встроенные: по умолчанию закреплены вверху списка, удалить можно (presets.js)
const BUILTIN={
  geo: Object.fromEntries(Object.values(PRESETS).map(b=>[b.name, BikePresets.pick('geo',{...b,wheelR:368})]))
};

BikePresets.init({
  builtin: BUILTIN,
  collect(kind,slot){                             // текущее состояние -> пресет
    return BikePresets.pick('geo',{...state.bikes[+slot], wheelR:state.wheelR});
  },
  apply(kind,slot,d,name){                        // пресет -> состояние
    const i=+slot, b={...state.bikes[i]};
    BikePresets.KEYS.geo.forEach(k=>{ if(k!=='wheelR') b[k]=d[k]; });
    b.name=name;
    state.bikes[i]=b;
    if(d.wheelR) state.wheelR=d.wheelR;
    buildInputs();
    const wr=document.getElementById('wr'); if(wr) wr.value=state.wheelR;
    render();
  },
  nameFor(row){                                   // имя пресета = имя рамы в карточке
    return (state.bikes[+row.dataset.slot].name||'').trim();
  }
});

/* ============ передача геометрии в Fit Lab ============
   Ссылку собирает BikeFrame.fitLabLink по тому же списку полей, по которому Fit Lab
   её читает (frame.js), — порядок не может разойтись. Уходит вся рама, включая
   замену и проверку вилки; пустая база выводится из офсета. Кокпит, тело и посадка
   не передаются — там остаётся то, что у Fit Lab по умолчанию. */
function fitLabLink(i){
  const b = state.bikes[i];
  return BikeFrame.fitLabLink(b, state.wheelR, b.name||'Bike '+(i+1));
}

function openInFit(i){
  track('geo-open-fitlab');
  window.open(fitLabLink(i), '_blank', 'noopener');
}

/* ================= сохранение состояния в ссылку ================= */
const HKEYS = ['reach','stack','hta','sta','ht','st','cs','bbDrop','wb','offset','travelRef','travel','sag','forkA2C','forkA2Cnew','forkOffsetNew','forkOffsetSpec','forkMeasLen'];

function stateToHash(){
  const enc = state.bikes.map(b =>
    [encodeURIComponent(b.name), ...HKEYS.map(k => b[k]==null||b[k]===''?'':b[k])].join('~')
  ).join('!');
  return `#w=${state.wheelR}&b=${enc}`;
}

function hashToState(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return false;
  try{
    const q = {};
    h.split('&').forEach(pair=>{ const i=pair.indexOf('='); q[pair.slice(0,i)] = pair.slice(i+1); });
    if(q.w) state.wheelR = parseFloat(q.w) || 368;
    if(!q.b) return false;
    const bikes = q.b.split('!').slice(0,2).map(chunk=>{
      const p = chunk.split('~');
      const b = { name: decodeURIComponent(p[0] || 'Bike') };
      HKEYS.forEach((k,i)=>{
        const v = p[i+1];
        b[k] = (v===undefined || v==='') ? null : parseFloat(v);
      });
      // обязательные поля — если пусто, подставляем из первого пресета
      HKEYS.forEach(k=>{ if(b[k]==null && !['wb','offset','forkA2C','forkA2Cnew','forkOffsetNew','forkOffsetSpec','forkMeasLen'].includes(k)) b[k] = PRESETS.B1[k]; });
      return b;
    });
    if(bikes.length===2){ state.bikes = bikes; return true; }
  }catch(e){ console.warn('не смог разобрать ссылку', e); }
  return false;
}

function syncHash(){
  // На file:// некоторые браузеры запрещают replaceState — тогда просто молчим,
  // кнопка «скопировать ссылку» всё равно собирает адрес из состояния.
  try{
    const h = stateToHash();
    if(location.hash !== h) history.replaceState(null, '', h);
  }catch(e){}
}

function currentLink(){
  return location.href.split('#')[0] + stateToHash();
}

function copyLink(){
  track('geo-copy-link');
  const url = currentLink();
  const done = ()=>{
    const el = document.getElementById('copyok');
    el.style.visibility='visible';
    clearTimeout(copyLink._t);
    copyLink._t = setTimeout(()=>el.style.visibility='hidden', 2200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(done, ()=>fallback(url, done));
  } else fallback(url, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ prompt('Скопируй ссылку вручную:', text); }
  document.body.removeChild(ta);
}

/* ================= печать ================= */
function doPrint(){
  track('geo-pdf');
  const S = state.bikes.map(b => BikeModel.hasFrontAxle(b) ? solve(b) : null);
  document.getElementById('printhead').innerHTML =
    `<div style="font-size:11px;margin:0 0 8px">` +
    S.map((s,i)=>s
      ? `<b style="color:${i?'#2b6cb0':'#e8543f'}">${esc(s.b.name)}</b> — ход ${s.b.travel} мм, sag ${s.b.sag ?? 0}% (просадка ${s.sagMM.toFixed(0)} мм), колесо R${state.wheelR}`
      : `<b style="color:${i?'#2b6cb0':'#e8543f'}">${esc(state.bikes[i].name)}</b> — не считается: нет ни базы, ни офсета`).join(' &nbsp;·&nbsp; ') +
    `</div><div class="prturl">${esc(currentLink())}</div>`;
  window.print();
}

/* Радиусы посчитаны как BSD/2 + высота покрышки над ободом; 29"×2.4 = 368 —
   та же калибровка, что была зашита раньше, просто продлённая на 27.5 и 26. */
const WHEEL_HINT = (()=>{
  const rows=[['2.1–2.2',327,343,362],['2.4',337,349,368],['2.6',343,356,375],['2.8','—',362,381]];
  const c='padding:2px 13px 2px 0;border:none;text-align:right';
  return 'Радиус накачанного колеса вместе с покрышкой. 26 / 27.5 / 29 модель считает одинаково корректно — важно только задать правильное число.'
   + '<table style="width:auto;margin:8px 0 6px;font-size:11.5px;border-collapse:collapse">'
   + `<tr><td style="${c};text-align:left;color:#999">покрышка</td>`
   + ['26"','27.5"','29"'].map(h=>`<td style="${c};color:#999">${h}</td>`).join('') + '</tr>'
   + rows.map(r=>`<tr><td style="${c};text-align:left">${r[0]}</td>`
       + r.slice(1).map(v=>`<td style="${c};font-variant-numeric:tabular-nums">${v}</td>`).join('') + '</tr>').join('')
   + '</table>'
   + 'Точнее — обмерь покрышку ниткой по кругу и подели на 6.28. Значение одно на обе рамы и на оба колеса.';
})();

/* Колесо — меню тулбара. Радиус виден на самой кнопке: он один на обе рамы и
   двигает высоту каретки, трейл и габарит, поэтому должен читаться без
   раскрытия меню. Поведение меню (закрыться мимо, по Escape) — в nav.js. */
document.getElementById('wrhint').innerHTML = WHEEL_HINT;
function wheelSync(){
  const w = document.getElementById('wr');
  if(w && document.activeElement !== w) w.value = state.wheelR;
  document.getElementById('wrsum').textContent = 'R ' + state.wheelR;
}
document.getElementById('wr').addEventListener('input', e=>{
  state.wheelR = parseFloat(e.target.value)||368; wheelSync(); render();
});

// восстановление из ссылки при загрузке
hashToState();
wheelSync();

buildInputs();
render();

// переход по другой ссылке в том же окне
window.addEventListener('hashchange', ()=>{
  if(location.hash !== stateToHash() && hashToState()){
    wheelSync();
    buildInputs(); render();
  }
});
</script>
